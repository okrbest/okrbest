name: Docs CI

on:
  # okrbest: 자동 트리거(pull_request, push)는 인프라를 확보할 때까지 끈다.
  # 복원 조건과 목록: spec-docs/upstream/upstream-adapted-divergences.md "문서 사이트 계보 복원".
  # 필요한 값: 없음 (선택: vars.ALGOLIA_APP_ID, vars.ALGOLIA_SEARCH_API_KEY) — 인프라 없이도 돌 수 있어 먼저 되살릴 후보
  # pull_request:
  #   paths:
  #     - ".github/workflows/docs-ci.yaml"
  #     - "docs/**"
  #     - "api/v4/source/**"
  #     - "api/playbooks/**"
  # push:
  #   branches:
  #     - master
  #   paths:
  #     - ".github/workflows/docs-ci.yaml"
  #     - "docs/**"
  #     - "api/v4/source/**"
  #     - "api/playbooks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/site/.nvmrc
          cache: "npm"
          cache-dependency-path: docs/site/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/server/go.mod

      - name: Install docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Typecheck
        working-directory: docs/site
        run: npm run typecheck

      - name: Egress-check unit tests
        working-directory: docs/site
        run: npm run test:egress

      - name: Build docs site (includes OpenAPI prebuild)
        working-directory: docs/site
        run: npm run build
        env:
          ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ vars.ALGOLIA_SEARCH_API_KEY }}

      - name: Check absolute docs.okrbest.com / docs.mattermost.com links
        working-directory: docs/site
        run: npm run check:absolute-links

      # Hosted Algolia injects SearchBar preconnects; do not scan that artifact.
      # Rebuild without ALGOLIA_* (prebuild already ran) for the offline shape.
      # BASE_URL matches the offline bundle the server ships (mattermost/delivery-platform
      # builds it with BASE_URL=/_documentation/), so links that only break under that
      # base URL fail here instead of in the release pipeline.
      - name: Rebuild offline bundle shape for egress scan
        working-directory: docs/site
        run: npx docusaurus build && npm run postbuild
        env:
          BASE_URL: /_documentation/

      - name: Scan built site for egress
        working-directory: docs/site
        run: npm run check:egress
