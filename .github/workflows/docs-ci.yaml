name: Docs CI

on:
  # okrbest: 자동 트리거(pull_request, push)는 인프라를 확보할 때까지 끈다.
  # 복원 조건과 목록: spec-docs/upstream/upstream-adapted-divergences.md "문서 사이트 계보 복원".
  # 필요한 값: 없음 (선택: vars.ALGOLIA_APP_ID, vars.ALGOLIA_SEARCH_API_KEY) — 인프라 없이도 돌 수 있어 먼저 되살릴 후보
  # pull_request:
  #   paths:
  #     - "docs/**"
  #     - "api/v4/source/**"
  #     - "api/playbooks/**"
  # push:
  #   branches:
  #     - master
  #   paths:
  #     - "docs/**"
  #     - "api/v4/source/**"
  #     - "api/playbooks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: docs/site/.nvmrc
          cache: "npm"
          cache-dependency-path: docs/site/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: api/server/go.mod

      - name: Install docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Typecheck
        working-directory: docs/site
        run: npm run typecheck

      - name: Egress-check unit tests
        working-directory: docs/site
        run: npm run test:egress

      - name: Build docs site (includes OpenAPI prebuild)
        working-directory: docs/site
        run: npm run build
        env:
          ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ vars.ALGOLIA_SEARCH_API_KEY }}

      # Hosted Algolia injects SearchBar preconnects; do not scan that artifact.
      # Rebuild without ALGOLIA_* (prebuild already ran) for the offline shape.
      - name: Rebuild without Algolia for egress scan
        working-directory: docs/site
        run: npx docusaurus build && npm run postbuild
        env:
          BASE_URL: /

      - name: Scan built site for egress
        working-directory: docs/site
        run: npm run check:egress
