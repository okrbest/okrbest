name: docs-preview-cleanup

on:
  # okrbest: 자동 트리거(pull_request)는 인프라를 확보할 때까지 끈다.
  # 복원 조건과 목록: spec-docs/upstream/upstream-adapted-divergences.md "문서 사이트 계보 복원".
  # 필요한 값: secrets.AWS_DOCS_PR_PREVIEW_KEY_ID, secrets.AWS_DOCS_PR_PREVIEW_SECRET_ACCESS_KEY, vars.DOCS_PREVIEW_BUCKET_NAME
  # pull_request:
  #   types: [closed]
  #   paths:
  #     - 'docs/**'
  #     - 'api/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete preview from S3
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_DOCS_PR_PREVIEW_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DOCS_PR_PREVIEW_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Delete preview prefix from S3
        env:
          PR_NUMBER: ${{ github.event.number }}
          BUCKET_NAME: ${{ vars.DOCS_PREVIEW_BUCKET_NAME }}
        run: |
          aws s3 rm "s3://${BUCKET_NAME}/okrbest/pr-${PR_NUMBER}/" --recursive
