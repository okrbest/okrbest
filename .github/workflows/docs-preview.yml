name: docs-preview

on:
  # okrbest: 자동 트리거(pull_request)는 인프라를 확보할 때까지 끈다.
  # 복원 조건과 목록: spec-docs/upstream/upstream-adapted-divergences.md "문서 사이트 계보 복원".
  # 필요한 값: secrets.AWS_DOCS_PR_PREVIEW_KEY_ID, secrets.AWS_DOCS_PR_PREVIEW_SECRET_ACCESS_KEY, vars.DOCS_PREVIEW_BUCKET_NAME
  # pull_request:
  #   types: [opened, reopened, synchronize]
  #   paths:
  #     - 'docs/**'
  #     - 'api/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    uses: ./.github/workflows/docs-preview-template.yml
    if: github.event.pull_request.head.repo.full_name == github.repository
    secrets:
      AWS_DOCS_PR_PREVIEW_KEY_ID: ${{ secrets.AWS_DOCS_PR_PREVIEW_KEY_ID }}
      AWS_DOCS_PR_PREVIEW_SECRET_ACCESS_KEY: ${{ secrets.AWS_DOCS_PR_PREVIEW_SECRET_ACCESS_KEY }}
    with:
      PR_NUMBER: ${{ github.event.number }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      STATUS_CONTEXT: docs-preview
